# Netlify configuration for the PUBLIC Glass Box build.
#
# The published site is a static snapshot: `dist/` contains the compiled SPA plus the
# JSON captured by `quantlab glassbox snapshot`. There is no server, no API, and no
# route back to the machine that trades — which is the entire point of the split.
#
# `base = "frontend"` makes every path below relative to this directory.

[build]
  base = "frontend"
  # `npm ci` (not `install`) so the lockfile is authoritative in CI.
  command = "npm ci && npm run build:public"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Selects the snapshot transport at build time. Also set by the npm script, but
  # declared here too so a Netlify-triggered build cannot accidentally ship live mode
  # (which would try to fetch /api/* against a static host and render error states).
  VITE_DATA_MODE = "snapshot"
  # The canonical host. `vite.config.ts` defaults to this same value, so the two would have
  # to disagree for a build to publish the wrong canonical; declared here as well so a
  # Netlify-triggered build is explicit about which hostname it claims to be.
  VITE_SITE_URL = "https://glassbox.danielmonzonautomation.com"

# --------------------------------------------------------------------------- #
# Security headers                                                            #
# --------------------------------------------------------------------------- #
# The site is entirely self-contained: no CDN, no analytics, no third-party fonts,
# no external images. A strict CSP is therefore free, and anything that later needs
# an exception should have to justify it here.

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self'; \
      script-src 'self'; \
      style-src 'self' 'unsafe-inline'; \
      img-src 'self' data:; \
      font-src 'self'; \
      connect-src 'self'; \
      object-src 'none'; \
      base-uri 'self'; \
      form-action 'none'; \
      frame-ancestors 'none'; \
      upgrade-insecure-requests"""
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # No feature this site uses needs any of these.
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Hashed assets are immutable; the snapshot is not (it is replaced on each refresh).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/snapshot/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# --------------------------------------------------------------------------- #
# Redirects                                                                   #
# --------------------------------------------------------------------------- #
# Pre-G1 paths, mirrored from `LEGACY_REDIRECTS` in src/lib/router.tsx. The client
# handles these too (so in-app navigation works), but declaring them server-side
# means an external inbound link gets a real 301 rather than a JS bounce.

[[redirects]]
  from = "/runs"
  to = "/decisions"
  status = 301

[[redirects]]
  from = "/divergence"
  to = "/tracking"
  status = 301

[[redirects]]
  from = "/risk"
  to = "/limits"
  status = 301

[[redirects]]
  from = "/glass"
  to = "/ignores"
  status = 301

[[redirects]]
  from = "/overview"
  to = "/live"
  status = 301

# SPA fallback. LAST, so the 301s above take precedence.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
