<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7f2e9" />

    <!--
      Defaults only. The head manager in src/components/chrome.tsx rewrites title and
      description per route once the bundle runs; these values are what a client that
      does not execute JavaScript sees, so they describe the site rather than any one
      screen.
    -->
    <title>Glass Box — every decision is arithmetic you can check</title>
    <meta
      name="description"
      content="The public window into quantlab: an autonomous trading-research system that trades simulated money by pre-registered rules and publishes every decision, mistake, and deliberate refusal. Not investment advice."
    />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Font preloads are injected at build time by the `fontPreload` plugin in
         vite.config.ts, from the ACTUAL hashed filenames Vite emitted. Writing them
         by hand produced links to files that never existed — two 404s per page load. -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Glass Box · MonzonAutomation" />
    <meta property="og:title" content="Glass Box — every decision is arithmetic you can check" />
    <meta
      property="og:description"
      content="An autonomous trading-research system that trades simulated money by pre-registered rules and publishes every decision it makes. A MonzonAutomation project."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Glass Box, a MonzonAutomation project — every decision is arithmetic you can check." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Glass Box — every decision is arithmetic you can check" />
    <meta
      name="twitter:description"
      content="An autonomous trading-research system that trades simulated money by pre-registered rules and publishes every decision it makes. A MonzonAutomation project."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
